# Instrumentation CR (GKE Managed OpenTelemetry) + Deployment for the Java sample.
# Replace PROJECT_ID, REGION, IMAGE_TAG; the namespace and service account follow the glb-trace-adk demo.
apiVersion: telemetry.googleapis.com/v1alpha1
kind: Instrumentation
metadata:
  name: java-logging-instrumentation
  namespace: p1-demo
spec:
  selector:
    matchLabels:
      app: java-logging
  autoInstrumentationConfig:
    configInjection:
      enabled: true
  otelSDKConfig:
    # Application logs reach Cloud Logging through stdout JSON only. Without this the Java agent's Logback appender
    # instrumentation would also export every log record over OTLP and each line would be ingested twice.
    logger_provider: null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-logging
  namespace: p1-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-logging
  template:
    metadata:
      labels:
        app: java-logging
    spec:
      serviceAccountName: p1-otel-app-ksa
      containers:
        - name: app
          image: REGION-docker.pkg.dev/PROJECT_ID/p1-lb-trace-repo/java-logging:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            # Required: the formatter refuses to start without it (full trace resource name needs the project).
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID"
            - name: OTEL_SERVICE_NAME
              value: "java-logging"
            # Pin the Cloud Logging formatter in the GKE Deployment so switching application.yaml to `logstash`,
            # `OpenTelemetryStructuredLogFormatter`, or local plain text never drops GKE back to multi-line text.
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: "com.example.logging.GoogleCloudStructuredLogFormatter"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: java-logging
  namespace: p1-demo
spec:
  type: ClusterIP
  selector:
    app: java-logging
  ports:
    - name: http
      port: 80
      targetPort: 8080
