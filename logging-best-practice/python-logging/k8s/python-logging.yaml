# Instrumentation CR (GKE Managed OpenTelemetry) + Deployment for the Python sample.
# Replace PROJECT_ID, REGION, IMAGE_TAG; the namespace and service account follow the glb-trace-adk demo.
apiVersion: telemetry.googleapis.com/v1alpha1
kind: Instrumentation
metadata:
  name: python-logging-instrumentation
  namespace: p1-demo
spec:
  selector:
    matchLabels:
      app: python-logging
  autoInstrumentationConfig:
    configInjection:
      enabled: true
  otelSDKConfig:
    # Application logs reach Cloud Logging through stdout JSON only. The Python OTLP log handler is opt-in anyway
    # (OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED); this keeps it off even if someone sets that variable.
    logger_provider: null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-logging
  namespace: p1-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-logging
  template:
    metadata:
      labels:
        app: python-logging
    spec:
      serviceAccountName: p1-otel-app-ksa
      containers:
        - name: app
          image: REGION-docker.pkg.dev/PROJECT_ID/p1-lb-trace-repo/python-logging:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            # Required: configure_logging() refuses to start without it (full trace resource name needs the project).
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID"
            - name: OTEL_SERVICE_NAME
              value: "python-logging"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: python-logging
  namespace: p1-demo
spec:
  type: ClusterIP
  selector:
    app: python-logging
  ports:
    - name: http
      port: 80
      targetPort: 8080
