apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: p1-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      serviceAccountName: p1-otel-app-ksa
      containers:
        - name: app
          image: REGION-docker.pkg.dev/PROJECT_ID/p1-lb-trace-repo/checkout-api:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID"
            - name: OTEL_SERVICE_NAME
              value: "checkout-api"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: p1-demo
spec:
  type: ClusterIP
  selector:
    app: checkout-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: p1-checkout-api-hc-policy
  namespace: p1-demo
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: checkout-api
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: p1-checkout-api-backend-policy
  namespace: p1-demo
spec:
  default:
    timeoutSec: 30
    logging:
      enabled: true
      sampleRate: 1000000
  targetRef:
    group: ""
    kind: Service
    name: checkout-api
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: p1-checkout-rilb-gw
  namespace: p1-demo
spec:
  gatewayClassName: gke-l7-rilb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p1-checkout-api-route
  namespace: p1-demo
spec:
  parentRefs:
    - name: p1-checkout-rilb-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: checkout-api
          port: 80
